<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スパ2X キャラ戦 チーム管理＆OBSツール</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<!-- HTML5 Drag and Drop サポート用ライブラリ (SortableJS) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<!-- 外部CSSファイルの読み込み -->
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- トップヘッダー（ルーム情報・マニュアル） -->
  <div class="top-header">
    <div class="room-header-controls">
      <span>🏠 現在のルーム: <strong id="currentRoomDisplay" style="color:#ff9f1c; font-size:1.1em;">default</strong></span>
      <input type="text" id="roomInput" placeholder="部屋名" style="width:140px; padding:3px 6px;">
      <button class="btn btn-warning" style="padding:4px 10px;" onclick="changeRoom()">部屋移動</button>
    </div>
    <a href="https://github.com/counterspell-nakamu/ssf2x-team-battle-test" target="_blank" class="manual-link">📖 使い方 / Manual</a>
  </div>

  <!-- メインコンテンツ（左右2分割レイアウト） -->
  <div class="app-container">
    
    <!-- 左カラム：OBS対戦枠・ベンチ表示エリア -->
    <div class="left-obs-area">
      <!-- 表示サイズ調整スライダー -->
      <div class="size-control-panel">
        <label for="cardSizeRange">🔍 表示サイズ: <span id="sizeValueDisplay">36px</span></label>
        <input type="range" id="cardSizeRange" min="28" max="52" value="36" oninput="updateCardSize(this.value)">
      </div>

      <div class="obs-display">
        <!-- 1P側グループ -->
        <div class="team-group">
          <div class="team-column">
            <div class="team-title p1-header">1P TEAM<br><span style="font-size:0.75em; font-weight:normal;">(対戦枠)</span></div>
            <div id="team1-match-display"></div>
          </div>
          <div class="team-column" id="team1-bench-col">
            <div class="team-title bench-header">1P 待機<br><span style="font-size:0.75em; font-weight:normal;">(ベンチ)</span></div>
            <div id="team1-bench-display"></div>
          </div>
        </div>

        <!-- 2P側グループ -->
        <div class="team-group">
          <div class="team-column">
            <div class="team-title p2-header">2P TEAM<br><span style="font-size:0.75em; font-weight:normal;">(対戦枠)</span></div>
            <div id="team2-match-display"></div>
          </div>
          <div class="team-column" id="team2-bench-col">
            <div class="team-title bench-header">2P 待機<br><span style="font-size:0.75em; font-weight:normal;">(ベンチ)</span></div>
            <div id="team2-bench-display"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右カラム：管理操作パネルエリア -->
    <div class="right-admin-area">
      <div class="admin-panel">
        <h3 style="margin-top:0; border-bottom: 1px solid #333; padding-bottom: 8px;">⚙️ 管理操作パネル</h3>

        <div class="grid-2">
          <!-- 1. プレイヤー選択 -->
          <div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
              <h3 style="margin:0; font-size:1em;">1. プレイヤー選択（本日の参加者）</h3>
              <div style="display:flex; gap:4px;">
                <button class="btn-arrow" type="button" onclick="selectAllPlayers(true)">全選択</button>
                <button class="btn-arrow" type="button" onclick="selectAllPlayers(false)">全解除</button>
              </div>
            </div>
            <div id="masterChecklist" class="member-checklist"></div>
            
            <div style="display:flex; gap:5px; margin-bottom:10px;">
              <input type="text" id="newPlayerInput" placeholder="新しいプレイヤー名を追加" style="flex:1;" onkeydown="handleNewPlayerKeyDown(event)">
              <button class="btn" onclick="addNewPlayer()">名簿に追加</button>
            </div>

            <div class="mode-select" style="margin-bottom:8px;">
              <b>⚖️ チーム分けモード:</b><br>
              <label><input type="radio" name="splitMode" value="normal" checked onchange="toggleTeamMode()"> 通常（半々で自動ランダム）</label><br>
              <label><input type="radio" name="splitMode" value="manual" onchange="toggleTeamMode()"> 手動選択・ドラッグ自由編成（1対5や変則人数に対応）</label>
            </div>

            <!-- 手動選択モード時のチーム分け操作エリア -->
            <div id="manualTeamPanel" style="display: none; background: #15151f; border: 1px solid #444; padding: 10px; border-radius: 6px; margin-bottom: 8px;">
              <div style="font-size: 0.85em; font-weight: bold; margin-bottom: 6px; color: #ff9f1c;">🛠️ 手動チーム編成（ドラッグまたは矢印で移動）</div>
              <div class="grid-2">
                <div style="background: #1a1a24; padding: 6px; border-radius: 4px; min-height: 70px;" ondragover="allowDrop(event)" ondrop="dropToTeam(event, '1P')">
                  <div style="font-size: 0.75em; font-weight: bold; color: #ff6b6b; margin-bottom: 3px;">1Pチーム (<span id="manual1pCount">0</span>)</div>
                  <div id="manual1pList" style="display: flex; flex-direction: column; gap: 3px;"></div>
                </div>
                <div style="background: #1a1a24; padding: 6px; border-radius: 4px; min-height: 70px;" ondragover="allowDrop(event)" ondrop="dropToTeam(event, '2P')">
                  <div style="font-size: 0.75em; font-weight: bold; color: #4dabf7; margin-bottom: 3px;">2Pチーム (<span id="manual2pCount">0</span>)</div>
                  <div id="manual2pList" style="display: flex; flex-direction: column; gap: 3px;"></div>
                </div>
              </div>
            </div>

            <button class="btn btn-success" style="width:100%;" onclick="makeRandomTeams()">チェックした人を1P / 2Pチームに自動振り分け</button>
          </div>

          <!-- 2. オーダー＆キャラ設定 -->
          <div>
            <h3 style="margin-top:0; font-size:1em;">2. オーダー＆キャラ設定</h3>
            <div style="margin-bottom:8px; display:flex; align-items:center; gap:8px; background:#111118; padding:6px 8px; border-radius:6px;">
              <label for="slotCountSelect" style="font-weight:bold; font-size:0.9em;">🎯 対戦枠数 (キャラ数):</label>
              <select id="slotCountSelect" onchange="changeSlotCount(this.value)" style="padding:3px 6px;"></select>
            </div>

            <div class="mode-select">
              <label><input type="radio" name="orderMode" value="manual" checked onclick="updateModalLabels()"> 手動設定（完全自由）</label><br>
              <label><input type="radio" name="orderMode" value="fullRandom" onclick="updateModalLabels()"> <span id="labelFullRandom">1〜16人目シャッフル（全員完全ランダム）</span></label><br>
              <label><input type="radio" name="orderMode" value="bossFixed" onclick="updateModalLabels()"> <span id="labelBossFixed">1〜15人目シャッフル ＋ 大将(16人目)固定</span></label><br>
              <label><input type="radio" name="orderMode" value="counterPick" onclick="updateModalLabels()"> <span id="labelCounterPick">先鋒申告 ＋ 2〜16人目被せ</span></label>
            </div>
            
            <div id="deviceRoleSection" class="mode-select" style="background:#20202d; margin-bottom:8px;">
              <b>📱 端末別入力モード設定:</b><br>
              <label><input type="radio" name="deviceRole" value="pc_all" checked onclick="setDeviceRole('pc_all')"> 💻 PC1台で両チーム分を入力する</label><br>
              <label><input type="radio" name="deviceRole" value="p1_only" onclick="setDeviceRole('p1_only')"> 🔴 この端末は 1Pチームのみ 操作＆閲覧</label><br>
              <label><input type="radio" name="deviceRole" value="p2_only" onclick="setDeviceRole('p2_only')"> 🔵 この端末は 2Pチームのみ 操作＆閲覧</label>
            </div>

            <div style="display:flex; flex-direction:column; gap:10px;">
              <button id="btnOpenP1" class="btn btn-success" onclick="openOrderModal('1')">🔴 1Pチーム オーダー設定</button>
              <button id="btnOpenP2" class="btn btn-success" onclick="openOrderModal('2')">🔵 2Pチーム オーダー設定</button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- オーダー設定モーダル -->
  <div id="orderModal" class="modal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;">
        <h3 id="modalTitle" style="margin:0;">オーダー設定</h3>
        <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
          <button id="btnModalCharBlacklist" class="btn btn-purple" style="display:none;" onclick="openCharBlacklistModal()">⚙️ キャラ制限設定</button>
          <button class="btn" style="background:#4a5568;" onclick="autoFillGroupedPlayers()">👥 プレイヤー連続初期配置</button>
          <button id="btnFillAll" class="btn btn-purple" onclick="fillFullRandomModal()">テスト用全部埋めるだけ</button>
        </div>
      </div>
      <div id="modalOrderRows"></div>
      <br>
      <div style="display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;">
        <button class="btn btn-success" onclick="saveOrderModal()">設定完了</button>
        <button class="btn btn-danger" onclick="closeOrderModal()">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- キャラクター出現制限（ブラックリスト）モーダル -->
  <div id="charBlacklistModal" class="modal">
    <div class="modal-content" style="max-width: 480px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="margin:0;">🚫 ランダム時出現キャラ設定</h3>
        <div style="display:flex; gap:6px;">
          <button class="btn-arrow" type="button" onclick="selectAllAllowedChars(true)">全選択</button>
          <button class="btn-arrow" type="button" onclick="selectAllAllowedChars(false)">全解除</button>
        </div>
      </div>
      <p style="font-size:0.85em; color:#aaa; margin-top:0; margin-bottom:12px;">
        パネルをクリックして有効/無効を切り替えます（選択中：カラー / 非選択：グレー）。
      </p>
      <div id="charBlacklistGrid" class="char-blacklist-grid"></div>
      <br>
      <div style="display:flex; justify-content:flex-end;">
        <button class="btn btn-success" onclick="closeCharBlacklistModal()">設定完了</button>
      </div>
    </div>
  </div>

  <div id="charPalette" class="char-palette"></div>

  <!-- 外部JavaScriptファイルの読み込み -->
  <script src="script.js"></script>
</body>
</html>
